openapi: 3.1.0
info:
  title: PitchTZ Client API
  version: 0.2.0
  summary: Public and authenticated player API for the PitchTZ mobile and client-web apps.
  description: |
    This contract intentionally excludes admin, owner, internal provider-webhook, and payout APIs.
    Operations marked `x-pitchtz-status: live` are deployed today. Operations marked `planned`
    are the agreed mobile contract and will be implemented without changing their request shape.
    All money values are integer Tanzanian shillings and all timestamps are RFC 3339 UTC values.
servers:
  - url: https://pitchtz-production.up.railway.app/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local development
tags:
  - name: Discovery
    description: Public cities, venues, availability, reviews, extras, and favorites.
  - name: Authentication
    description: Player OTP/OAuth sessions. Admin authentication is intentionally not included.
  - name: Profile
    description: Authenticated player profile, bookings, and devices.
  - name: Bookings
    description: Slot reservation, payment choice, cancellation, and disputes.
  - name: Scan to pay
    description: Expiring capability-link payment for guests without the app.
  - name: Teams
    description: Public team browse and authenticated team actions.
  - name: Competitions
    description: Public leagues, standings, fixtures, and tournaments.
  - name: Notifications
    description: In-app notification inbox and push-device registration.
  - name: Growth
    description: Public city launch waitlist.
paths:
  /cities:
    get:
      tags: [Discovery]
      summary: List PitchTZ cities
      operationId: listCities
      x-pitchtz-status: live
      responses:
        "200":
          description: Cities and launch state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityListResponse"
        default:
          $ref: "#/components/responses/Error"
  /venues:
    get:
      tags: [Discovery]
      summary: Search active venues
      operationId: listVenues
      x-pitchtz-status: live
      parameters:
        - $ref: "#/components/parameters/CityID"
        - name: format
          in: query
          schema: { type: string, enum: ["5", "7", "11", futsal] }
        - name: near
          in: query
          description: Latitude and longitude separated by a comma.
          example: "-6.7924,39.2083"
          schema: { type: string }
        - name: radius
          in: query
          description: Search radius in kilometres; requires `near` and defaults to 10.
          schema: { type: number, minimum: 0.1, maximum: 100 }
      responses:
        "200":
          description: Sanitized active venues, limited to 100 results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueListResponse"
        default:
          $ref: "#/components/responses/Error"
  /venues/{venueId}:
    get:
      tags: [Discovery]
      summary: Get an active venue
      operationId: getVenue
      x-pitchtz-status: live
      parameters:
        - $ref: "#/components/parameters/VenueID"
      responses:
        "200":
          description: Public venue details with pitches, photos, and currently available extras.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /venues/{venueId}/availability:
    get:
      tags: [Discovery]
      summary: Get unavailable windows for a venue
      operationId: getVenueAvailability
      x-pitchtz-status: live
      parameters:
        - $ref: "#/components/parameters/VenueID"
        - name: date
          in: query
          description: Tanzania calendar day. Omit when using `from` and `to`.
          schema: { type: string, format: date }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Maximum window is 31 days.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Per-pitch unavailable windows. A missing window is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        default:
          $ref: "#/components/responses/Error"
  /venues/{venueId}/reviews:
    get:
      tags: [Discovery]
      summary: List public venue reviews
      operationId: listVenueReviews
      x-pitchtz-status: live
      parameters:
        - $ref: "#/components/parameters/VenueID"
      responses:
        "200":
          description: Reviews without reviewer PII.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Discovery]
      summary: Review a completed booking
      operationId: createVenueReview
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/VenueID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: Review created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponse"
        default:
          $ref: "#/components/responses/Error"
  /venues/{venueId}/extras:
    get:
      tags: [Discovery]
      summary: List available venue extras
      operationId: listVenueExtras
      x-pitchtz-status: live
      parameters:
        - $ref: "#/components/parameters/VenueID"
      responses:
        "200":
          description: Available equipment, refreshments, and other add-ons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtraListResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/otp/send:
    post:
      tags: [Authentication]
      summary: Send a player login OTP
      operationId: sendPlayerOTP
      x-pitchtz-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "+255712345678" }
      responses:
        "202":
          description: OTP accepted for delivery. The response is deliberately non-enumerating.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/otp/verify:
    post:
      tags: [Authentication]
      summary: Verify an OTP and issue player JWTs
      operationId: verifyPlayerOTP
      x-pitchtz-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, example: "+255712345678" }
                code: { type: string, pattern: "^[0-9]{6}$", example: "123456" }
      responses:
        "200":
          description: Player session tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/oauth/{provider}:
    post:
      tags: [Authentication]
      summary: Exchange a Google or Apple identity token
      operationId: exchangePlayerOAuthToken
      x-pitchtz-status: planned
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, apple] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity_token]
              properties:
                identity_token: { type: string, writeOnly: true }
                nonce: { type: string }
      responses:
        "200":
          description: Player session tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate a player refresh token
      operationId: refreshPlayerSession
      x-pitchtz-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, writeOnly: true }
      responses:
        "200":
          description: Rotated player session tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current player session
      operationId: logoutPlayer
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      responses:
        "204": { description: Session revoked. }
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      tags: [Profile]
      summary: Get the signed-in player
      operationId: getMe
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      responses:
        "200":
          description: Player profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResponse"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Profile]
      summary: Update the signed-in player
      operationId: updateMe
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                language: { type: string, enum: [en, sw] }
                city_id: { type: string, format: uuid }
                avatar_url: { type: string, format: uri }
      responses:
        "200":
          description: Updated player profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/bookings:
    get:
      tags: [Profile]
      summary: List the player's bookings
      operationId: listMyBookings
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, confirmed, part_paid, completed, cancelled, disputed] }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated bookings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/favorites:
    get:
      tags: [Discovery]
      summary: List the player's favorite venues
      operationId: listMyFavorites
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      responses:
        "200":
          description: Favorite active venues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueListResponse"
        default:
          $ref: "#/components/responses/Error"
  /me/favorites/{venueId}:
    put:
      tags: [Discovery]
      summary: Save a venue as a favorite
      operationId: addFavorite
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/VenueID"
      responses:
        "204": { description: Favorite saved idempotently. }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Discovery]
      summary: Remove a favorite venue
      operationId: removeFavorite
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/VenueID"
      responses:
        "204": { description: Favorite removed idempotently. }
        default:
          $ref: "#/components/responses/Error"
  /me/devices:
    post:
      tags: [Notifications]
      summary: Register or refresh a push device
      operationId: registerDevice
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform: { type: string, enum: [ios, android, web] }
                token: { type: string, writeOnly: true }
      responses:
        "204": { description: Device registered idempotently. }
        default:
          $ref: "#/components/responses/Error"
  /bookings:
    post:
      tags: [Bookings]
      summary: Lock slots and create a pending booking
      operationId: createBooking
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Pending booking created with a 10-minute payment lock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "409":
          description: One or more requested slots are no longer available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
  /bookings/{bookingId}:
    get:
      tags: [Bookings]
      summary: Get the player's booking
      operationId: getBooking
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/BookingID"
      responses:
        "200":
          description: Booking, extras, payment shares, and payment state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        default:
          $ref: "#/components/responses/Error"
  /bookings/{bookingId}/pay:
    post:
      tags: [Bookings]
      summary: Choose full, installment, or split payment
      operationId: payBooking
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/BookingID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayBookingRequest"
      responses:
        "202":
          description: Payment request accepted; final state arrives asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        default:
          $ref: "#/components/responses/Error"
  /bookings/{bookingId}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel a booking and start any eligible refund
      operationId: cancelBooking
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/BookingID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "202":
          description: Cancellation accepted; refund status is returned on the booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        default:
          $ref: "#/components/responses/Error"
  /disputes:
    post:
      tags: [Bookings]
      summary: Open a dispute for one of the player's bookings
      operationId: createDispute
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDisputeRequest"
      responses:
        "201":
          description: Dispute opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeResponse"
        default:
          $ref: "#/components/responses/Error"
  /pay/qr/{session}:
    get:
      tags: [Scan to pay]
      summary: Get an expiring guest payment share
      operationId: getQRPaymentSession
      x-pitchtz-status: planned
      parameters:
        - name: session
          in: path
          required: true
          schema: { type: string, minLength: 24 }
      responses:
        "200":
          description: Sanitized share and booking summary; no player PII.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRPaymentResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Scan to pay]
      summary: Pay an expiring guest share
      operationId: payQRPaymentSession
      x-pitchtz-status: planned
      parameters:
        - name: session
          in: path
          required: true
          schema: { type: string, minLength: 24 }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMethodRequest"
      responses:
        "202":
          description: Guest payment accepted for processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        default:
          $ref: "#/components/responses/Error"
  /teams:
    get:
      tags: [Teams]
      summary: Browse public teams
      operationId: listTeams
      x-pitchtz-status: planned
      parameters:
        - $ref: "#/components/parameters/CityID"
        - name: recruiting
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Sanitized team profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Teams]
      summary: Create a team as captain
      operationId: createTeam
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, tag, city_id, format]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                tag: { type: string, minLength: 2, maxLength: 12 }
                city_id: { type: string, format: uuid }
                format: { type: string, enum: ["5", "7", "11", futsal] }
                recruiting: { type: boolean, default: false }
                needs: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        default:
          $ref: "#/components/responses/Error"
  /teams/{teamId}:
    get:
      tags: [Teams]
      summary: Get a public team profile
      operationId: getTeam
      x-pitchtz-status: planned
      parameters:
        - $ref: "#/components/parameters/TeamID"
      responses:
        "200":
          description: Team profile and public fixture summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        default:
          $ref: "#/components/responses/Error"
  /teams/{teamId}/join:
    post:
      tags: [Teams]
      summary: Request to join a recruiting team
      operationId: joinTeam
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/TeamID"
      responses:
        "202":
          description: Join request created idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        default:
          $ref: "#/components/responses/Error"
  /teams/{teamId}/challenges:
    post:
      tags: [Teams]
      summary: Challenge another team
      operationId: challengeTeam
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opponent_team_id]
              properties:
                opponent_team_id: { type: string, format: uuid }
                proposed_at: { type: string, format: date-time }
                message: { type: string, maxLength: 300 }
      responses:
        "201":
          description: Challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        default:
          $ref: "#/components/responses/Error"
  /matches/{matchId}/accept:
    post:
      tags: [Teams]
      summary: Accept a team challenge
      operationId: acceptChallenge
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      parameters:
        - name: matchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Challenge accepted; a booking/payment step may be required next.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        default:
          $ref: "#/components/responses/Error"
  /leagues:
    get:
      tags: [Competitions]
      summary: Browse public leagues
      operationId: listLeagues
      x-pitchtz-status: planned
      parameters:
        - $ref: "#/components/parameters/CityID"
      responses:
        "200":
          description: Public leagues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueListResponse"
        default:
          $ref: "#/components/responses/Error"
  /leagues/{leagueId}/standings:
    get:
      tags: [Competitions]
      summary: Get public league standings
      operationId: getLeagueStandings
      x-pitchtz-status: planned
      parameters:
        - name: leagueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ordered public standings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingListResponse"
        default:
          $ref: "#/components/responses/Error"
  /tournaments:
    get:
      tags: [Competitions]
      summary: Browse public tournaments
      operationId: listTournaments
      x-pitchtz-status: planned
      parameters:
        - $ref: "#/components/parameters/CityID"
      responses:
        "200":
          description: Public tournament cards and brackets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentListResponse"
        default:
          $ref: "#/components/responses/Error"
  /notifications:
    get:
      tags: [Notifications]
      summary: List the player's notifications
      operationId: listNotifications
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated notification inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        default:
          $ref: "#/components/responses/Error"
  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Mark an in-app notification as read
      operationId: markNotificationRead
      x-pitchtz-status: planned
      security: [{ playerBearer: [] }]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Notification marked read idempotently. }
        default:
          $ref: "#/components/responses/Error"
  /waitlist:
    post:
      tags: [Growth]
      summary: Join a city's launch waitlist
      operationId: joinCityWaitlist
      x-pitchtz-status: live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_id]
              properties:
                city_id: { type: string, format: uuid }
                email: { type: string, format: email }
                phone: { type: string, example: "+255712345678" }
              anyOf:
                - required: [email]
                - required: [phone]
      responses:
        "202":
          description: Waitlist entry accepted idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistResponse"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    playerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Player access JWT issued by OTP or OAuth. Admin JWTs are a different audience and are rejected.
  parameters:
    CityID:
      name: city_id
      in: query
      schema: { type: string, format: uuid }
    VenueID:
      name: venueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookingID:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TeamID:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A new UUID per user action. Reuse the same value when retrying the same action.
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource does not exist or is not publicly visible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
        message: { type: string }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: INVALID_INPUT }
            message: { type: string }
    City:
      type: object
      required: [id, name, status, latitude, longitude]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Dar es Salaam }
        status: { type: string, enum: [live, waitlist] }
        launch_eta: { type: string, format: date-time }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
    Pitch:
      type: object
      required: [id, name, format, surface, base_price_tzs, open_hours]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        format: { type: string, enum: ["5", "7", "11", futsal] }
        surface: { type: string, example: artificial_turf }
        base_price_tzs: { type: integer, format: int64, minimum: 0, example: 60000 }
        open_hours: { type: object, additionalProperties: true }
    VenuePhoto:
      type: object
      required: [sort, alt]
      properties:
        url: { type: string, format: uri }
        sort: { type: integer }
        alt: { type: string }
    Extra:
      type: object
      required: [id, kind, name, price_tzs, unit, available]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, example: equipment }
        name: { type: string, example: Football boots }
        price_tzs: { type: integer, format: int64, minimum: 0 }
        unit: { type: string, example: pair }
        available: { type: boolean }
    Venue:
      type: object
      required: [id, name, area, city, latitude, longitude, verified, rating, amenities, rules, cancel_window_hours, auto_confirm, price_from_tzs, pitches, photos, extras]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        area: { type: string }
        city: { $ref: "#/components/schemas/City" }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        verified: { type: boolean }
        rating: { type: number, minimum: 0, maximum: 5 }
        amenities: { type: array, items: { type: string } }
        rules: { type: array, items: { type: string } }
        cancel_window_hours: { type: integer, minimum: 0 }
        auto_confirm: { type: boolean }
        price_from_tzs: { type: integer, format: int64, minimum: 0 }
        pitches: { type: array, items: { $ref: "#/components/schemas/Pitch" } }
        photos: { type: array, items: { $ref: "#/components/schemas/VenuePhoto" } }
        extras: { type: array, items: { $ref: "#/components/schemas/Extra" } }
    Review:
      type: object
      required: [id, stars, text, tags, created_at]
      properties:
        id: { type: string, format: uuid }
        stars: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string }
        tags: { type: array, items: { type: string } }
        owner_reply: { type: string }
        replied_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    Player:
      type: object
      required: [id, name, language, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        avatar_url: { type: string, format: uri }
        language: { type: string, enum: [en, sw] }
        city_id: { type: string, format: uuid }
        role: { type: string, enum: [player, owner] }
    Booking:
      type: object
      required: [id, code, pitch_id, starts_at, ends_at, status, pitch_fee_tzs, service_fee_tzs, total_tzs, payment_shares]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: PITCH-7284 }
        pitch_id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, confirmed, part_paid, completed, cancelled, disputed] }
        repeat_rule: { type: string, enum: [once, weekly4, monthly, 3months] }
        pitch_fee_tzs: { type: integer, format: int64 }
        service_fee_tzs: { type: integer, format: int64 }
        total_tzs: { type: integer, format: int64 }
        lock_expires_at: { type: string, format: date-time }
        payment_shares: { type: array, items: { $ref: "#/components/schemas/PaymentShare" } }
    PaymentShare:
      type: object
      required: [id, amount_tzs, kind, status]
      properties:
        id: { type: string, format: uuid }
        amount_tzs: { type: integer, format: int64 }
        kind: { type: string, enum: [full, share, installment_1, installment_2, organizer_cover, tip_guards, tip_venue] }
        status: { type: string, enum: [unpaid, pending, paid, refunded, failed] }
        due_at: { type: string, format: date-time }
        qr_url: { type: string, format: uri }
        paid_at: { type: string, format: date-time }
    Team:
      type: object
      required: [id, name, tag, city_id, format, recruiting, needs]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tag: { type: string }
        city_id: { type: string, format: uuid }
        format: { type: string, enum: ["5", "7", "11", futsal] }
        recruiting: { type: boolean }
        needs: { type: string }
        league_id: { type: string, format: uuid }
    Match:
      type: object
      required: [id, home_team_id, away_team_id, status]
      properties:
        id: { type: string, format: uuid }
        home_team_id: { type: string, format: uuid }
        away_team_id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        status: { type: string, enum: [challenge_sent, accepted, played, cancelled] }
        home_score: { type: integer, minimum: 0 }
        away_score: { type: integer, minimum: 0 }
        played_at: { type: string, format: date-time }
    League:
      type: object
      required: [id, name, city_id, season]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city_id: { type: string, format: uuid }
        season: { type: string }
    Standing:
      type: object
      required: [team_id, played, won, drawn, lost, points]
      properties:
        team_id: { type: string, format: uuid }
        team_name: { type: string }
        played: { type: integer }
        won: { type: integer }
        drawn: { type: integer }
        lost: { type: integer }
        points: { type: integer }
    Tournament:
      type: object
      required: [id, name, kind, entry_fee_tzs, pot_tzs, bracket]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        venue_id: { type: string, format: uuid }
        entry_fee_tzs: { type: integer, format: int64 }
        pot_tzs: { type: integer, format: int64 }
        bracket: { type: object, additionalProperties: true }
    Notification:
      type: object
      required: [id, title, body, kind, created_at, read]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        kind: { type: string }
        data: { type: object, additionalProperties: true }
        read: { type: boolean }
        created_at: { type: string, format: date-time }
    CreateBookingRequest:
      type: object
      required: [pitch_id, slots]
      properties:
        pitch_id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        slots:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            required: [starts_at, ends_at]
            properties:
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
        extras:
          type: array
          items:
            type: object
            required: [extra_id, quantity]
            properties:
              extra_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 50 }
        repeat_rule: { type: string, enum: [once, weekly4, monthly, 3months], default: once }
        promo_code: { type: string }
    PayBookingRequest:
      type: object
      required: [mode, payment_method]
      properties:
        mode: { type: string, enum: [full, installment, split] }
        split_count: { type: integer, minimum: 2, maximum: 30 }
        payment_method: { $ref: "#/components/schemas/PaymentMethodRequest" }
        payer_phones:
          type: array
          items: { type: string, example: "+255712345678" }
    PaymentMethodRequest:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [mpesa, airtel_money, mixx, card] }
        phone: { type: string, example: "+255712345678" }
        return_url: { type: string, format: uri }
    CreateReviewRequest:
      type: object
      required: [booking_id, stars]
      properties:
        booking_id: { type: string, format: uuid }
        stars: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, maxLength: 2000 }
        tags: { type: array, maxItems: 10, items: { type: string } }
    CreateDisputeRequest:
      type: object
      required: [booking_id, kind, detail]
      properties:
        booking_id: { type: string, format: uuid }
        kind: { type: string, enum: [refund, time_not_honoured, split_stuck, venue_no_show] }
        detail: { type: string, minLength: 10, maxLength: 4000 }
        evidence: { type: object, additionalProperties: true }
    CityListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { type: array, items: { $ref: "#/components/schemas/City" } } }
    VenueListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { type: array, items: { $ref: "#/components/schemas/Venue" } } }
    VenueResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/Venue" } }
    ExtraListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { type: array, items: { $ref: "#/components/schemas/Extra" } } }
    ReviewListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { type: array, items: { $ref: "#/components/schemas/Review" } } }
    ReviewResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/Review" } }
    AvailabilityResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [venue_id, from, to, pitches]
              properties:
                venue_id: { type: string, format: uuid }
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                pitches:
                  type: array
                  items:
                    type: object
                    required: [pitch, unavailable]
                    properties:
                      pitch: { $ref: "#/components/schemas/Pitch" }
                      unavailable:
                        type: array
                        items:
                          type: object
                          required: [starts_at, ends_at, kind]
                          properties:
                            starts_at: { type: string, format: date-time }
                            ends_at: { type: string, format: date-time }
                            kind: { type: string, enum: [booked, blocked] }
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [access_token, refresh_token, token_type, expires_at, player]
              properties:
                access_token: { type: string, writeOnly: true }
                refresh_token: { type: string, writeOnly: true }
                token_type: { type: string, const: Bearer }
                expires_at: { type: string, format: date-time }
                player: { $ref: "#/components/schemas/Player" }
    PlayerResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/Player" } }
    BookingResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/Booking" } }
    BookingListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items: { type: array, items: { $ref: "#/components/schemas/Booking" } }
                next_cursor: { type: string }
    PaymentResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, paid, failed] }
                provider_action_url: { type: string, format: uri }
                share: { $ref: "#/components/schemas/PaymentShare" }
    QRPaymentResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [booking_code, venue_name, amount_tzs, status, expires_at]
              properties:
                booking_code: { type: string }
                venue_name: { type: string }
                starts_at: { type: string, format: date-time }
                amount_tzs: { type: integer, format: int64 }
                status: { type: string, enum: [unpaid, pending, paid, expired] }
                expires_at: { type: string, format: date-time }
    TeamResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/Team" } }
    TeamListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { type: array, items: { $ref: "#/components/schemas/Team" } } }
    MatchResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/Match" } }
    LeagueListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { type: array, items: { $ref: "#/components/schemas/League" } } }
    StandingListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { type: array, items: { $ref: "#/components/schemas/Standing" } } }
    TournamentListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { type: array, items: { $ref: "#/components/schemas/Tournament" } } }
    DisputeResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [id, booking_id, kind, status, created_at]
              properties:
                id: { type: string, format: uuid }
                booking_id: { type: string, format: uuid }
                kind: { type: string }
                status: { type: string, enum: [open, refunded, resolved] }
                created_at: { type: string, format: date-time }
    NotificationListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                next_cursor: { type: string }
    AcceptedResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
    WaitlistResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [id, status, city]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, const: accepted }
                city: { $ref: "#/components/schemas/City" }
