openapi: 3.0.3
info:
  title: PitchTZ Client API
  version: "2.0.0"
  description: |
    The mobile handover contract for the PitchTZ player experience. Every
    operation in this document is **deployed and live today** — this spec is
    generated from the running router, not a wishlist.

    **See it all working first:** the client web at
    https://pitchtz.flutterai.dev is the reference implementation of this API.
    Booking with hold countdown, split QR payments, teams & open challenges,
    Google-Maps discovery, watch areas with the live match board, the shop,
    reviews — every flow below can be exercised there end-to-end before you
    write a line of mobile code.

    Conventions:
    - Every response is wrapped: `{ "success": bool, "data": …, "message": str }`
      on success and `{ "success": false, "error": { "code", "message" } }` on failure.
    - Money is integer Tanzanian shillings (no decimals).
    - Timestamps are RFC 3339 UTC; display times in Africa/Dar_es_Salaam (+03:00).
    - Auth is a Bearer JWT from email-code verify or the social redirect flow.
      Client tokens live 30 days; exchange via `/auth/refresh` past half-life.
    - Payment method logos/operators come from the companion Malipo gateway:
      `GET https://api.malipo.flutterai.dev/v1/providers/active` (no auth).

    Excluded on purpose: venue-owner, superadmin and provider-webhook APIs.
servers:
  - url: https://pitchtz-production.up.railway.app/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local development
tags:
  - name: Discovery
    description: Cities, venues, pitches, availability, extras, reviews.
  - name: Auth
    description: Email-code and social sign-in, profile, sliding refresh.
  - name: Bookings
    description: Holds, payments (full / split / QR share links).
  - name: Teams
    description: Create, explore, join, and challenge — football finds its people.
  - name: Fixtures
    description: Scraped match board — Ligi Kuu Bara, Europe's top five, basketball.
  - name: Shop
    description: PitchTZ merchandise with mobile-money checkout.
  - name: Misc

security: []

paths:
  /cities:
    get:
      tags: [Discovery]
      summary: List cities (live + waitlist)
      responses:
        "200":
          description: Cities ordered as stored; filter by `status`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/City" }

  /venues:
    get:
      tags: [Discovery]
      summary: List active venues
      description: Includes pitches (with photo galleries), venue photos, extras and coordinates.
      responses:
        "200":
          description: Active venues.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Venue" }

  /venues/{venueId}:
    get:
      tags: [Discovery]
      summary: Venue detail
      parameters: [{ $ref: "#/components/parameters/venueId" }]
      responses:
        "200":
          description: Full venue with pitches, photos, extras, opening hours, status.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Venue" }
        "404": { $ref: "#/components/responses/NotFound" }

  /venues/{venueId}/availability:
    get:
      tags: [Discovery]
      summary: Unavailable windows per pitch
      description: |
        Returns blocked windows (bookings, holds, slot blocks) per pitch for
        the requested range. Build the slot grid client-side from the venue's
        `open_hours` (empty object = default 08:00–23:00), marking any slot
        that overlaps an unavailable window. `kind: processing` means someone
        is paying for that slot right now — show it orange, not bookable.
      parameters:
        - { $ref: "#/components/parameters/venueId" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: date
          in: query
          description: Shortcut — a single YYYY-MM-DD day.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Availability by pitch.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Availability" }

  /venues/{venueId}/reviews:
    get:
      tags: [Discovery]
      summary: Venue reviews
      parameters: [{ $ref: "#/components/parameters/venueId" }]
      responses:
        "200":
          description: Reviews with owner replies.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Review" }
    post:
      tags: [Discovery]
      summary: Leave a review (requires a completed booking)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/venueId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                text: { type: string, maxLength: 1000 }
      responses:
        "201": { description: Review created. }
        "403": { description: No completed booking at this venue. }

  /venues/{venueId}/extras:
    get:
      tags: [Discovery]
      summary: Facilities & rentals for a venue
      description: price_tzs 0 means the facility is free; only switched-on items are returned.
      parameters: [{ $ref: "#/components/parameters/venueId" }]
      responses:
        "200":
          description: Available extras.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Extra" }

  /auth/email/start:
    post:
      tags: [Auth]
      summary: Send a 6-digit sign-in code
      description: Creates the account on first use — one identity per email across all PitchTZ verticals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Code emailed (valid 10 minutes, single use). }
        "429": { description: Too many codes requested. }

  /auth/email/verify:
    post:
      tags: [Auth]
      summary: Exchange the code for a 30-day bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/TokenGrant" }
        "400": { description: Invalid or expired code. }
        "429": { description: Locked after 5 failed attempts (15 minutes). }

  /auth/google/start:
    get:
      tags: [Auth]
      summary: Begin Google sign-in (browser redirect flow)
      description: |
        Open in a browser/custom tab. After consent the API redirects to the
        client site with `#oauth_token=<jwt>`; a mobile app should intercept
        that redirect (ASWebAuthenticationSession / Custom Tabs) and store the
        token. Apple is identical at `/auth/apple/start`.
      responses:
        "302": { description: Redirect to Google consent. }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The signed-in player.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Sliding refresh — trade a valid token for a fresh 30-day one
      description: Call when the stored token is past half its life. An expired token cannot refresh; fall back to sign-in.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Fresh token.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/TokenGrant" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookings:
    post:
      tags: [Bookings]
      summary: Hold a slot on a specific pitch
      description: |
        Bookings are per **pitch**, never per venue. A successful call places a
        10-minute hold (`hold_expires_at`); pay within it or the slot releases.
        Money safety is server-side: a charge that completes after the hold
        expired still wins the slot back.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pitch_id, starts_at, ends_at]
              properties:
                pitch_id: { type: string, format: uuid }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
      responses:
        "201":
          description: Slot held.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Booking" }
        "409":
          description: Slot taken, pitch not active, or outside the venue's opening hours (`OUTSIDE_OPEN_HOURS`, `PITCH_UNAVAILABLE`, `BOOKING_CONFLICT`).
    get:
      tags: [Bookings]
      summary: My bookings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The player's bookings, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Booking" }

  /bookings/{bookingId}:
    get:
      tags: [Bookings]
      summary: One booking with its payment shares
      description: Poll this while a payment is pending — status flips to part_paid / confirmed as money settles.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/bookingId" }]
      responses:
        "200":
          description: Booking detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bookings/{bookingId}/pay:
    post:
      tags: [Bookings]
      summary: Charge the full amount to one mobile-money number
      description: Triggers a USSD push via the Malipo gateway. Get valid operators from Malipo's active-providers endpoint; never hardcode them.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/bookingId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, operator]
              properties:
                phone: { type: string, example: "255744963858" }
                operator: { type: string, example: "AIRTEL_TZA" }
      responses:
        "200": { description: Charge initiated — poll the booking for settlement. }
        "409": { description: Hold expired or already fully paid. }

  /bookings/{bookingId}/split:
    post:
      tags: [Bookings]
      summary: Split the bill into shareable QR pay links
      description: Each share gets an unguessable `pay_url` — render it as a QR; friends pay without an account.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/bookingId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ways]
              properties:
                ways: { type: integer, minimum: 2, maximum: 12 }
      responses:
        "200":
          description: Booking with its shares (kind `split`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Booking" }

  /pay/shares/{shareId}:
    get:
      tags: [Bookings]
      summary: Public share details (no auth — the id is the capability)
      parameters: [{ $ref: "#/components/parameters/shareId" }]
      responses:
        "200":
          description: What this share pays for.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PublicShare" }

  /pay/shares/{shareId}/pay:
    post:
      tags: [Bookings]
      summary: Pay one share from any phone (no auth)
      parameters: [{ $ref: "#/components/parameters/shareId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, operator]
              properties:
                phone: { type: string }
                operator: { type: string }
      responses:
        "200": { description: Charge initiated for this share. }

  /teams:
    get:
      tags: [Teams]
      summary: Explore teams
      description: Public; send the bearer token to also receive your membership status per team.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search name / tag / area. }
        - { name: city_id, in: query, schema: { type: string, format: uuid } }
        - { name: format, in: query, schema: { type: string, example: 5-a-side } }
        - { name: recruiting, in: query, schema: { type: string, enum: ["true"] } }
      responses:
        "200":
          description: Team cards.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TeamCard" }
    post:
      tags: [Teams]
      summary: Create a team (you become captain)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, city_id, format]
              properties:
                name: { type: string, minLength: 2, maxLength: 60 }
                city_id: { type: string, format: uuid }
                area: { type: string, maxLength: 120 }
                format: { type: string, example: 7-a-side }
                bio: { type: string, maxLength: 280 }
                badge_color: { type: string, example: "#0e3b2c" }
                recruiting: { type: boolean }
                needs: { type: string, maxLength: 120, example: "A keeper and 2 defenders" }
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/TeamCard" }

  /teams/{teamId}:
    get:
      tags: [Teams]
      summary: Team detail with squad
      description: Pending join requests are included only when the viewer is the captain.
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/teamId" }]
      responses:
        "200":
          description: Team + members.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          team: { $ref: "#/components/schemas/TeamCard" }
                          members:
                            type: array
                            items: { $ref: "#/components/schemas/TeamMember" }

  /me/teams:
    get:
      tags: [Teams]
      summary: My teams (memberships + pending requests)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Team cards with `membership` / `is_captain` set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TeamCard" }

  /teams/{teamId}/join:
    post:
      tags: [Teams]
      summary: Ask to join a team
      description: The captain receives an email and decides; you'll get an email either way.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/teamId" }]
      responses:
        "201": { description: Request sent (status `requested`). }
        "200": { description: You already have a request or membership. }

  /teams/{teamId}/decide:
    post:
      tags: [Teams]
      summary: Captain accepts or declines a join request
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/teamId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, accept]
              properties:
                user_id: { type: string, format: uuid }
                accept: { type: boolean }
      responses:
        "200": { description: Decision saved; the player is emailed. }
        "403": { description: Only the captain can decide. }

  /teams/{teamId}/challenges:
    post:
      tags: [Teams]
      summary: Captain posts an open challenge
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/teamId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 200 }
                proposed_at: { type: string, format: date-time }
      responses:
        "201": { description: Challenge is on the public board. }

  /challenges:
    get:
      tags: [Teams]
      summary: Open challenges board
      parameters:
        - { name: city_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Open challenges, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Challenge" }

  /challenges/{challengeId}/accept:
    post:
      tags: [Teams]
      summary: Take an open challenge (captains only)
      description: Race-safe — first accept wins; both captains get a "game on" email to arrange the pitch.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team_id]
              properties:
                team_id: { type: string, format: uuid, description: Your team (you must be its captain). }
      responses:
        "200": { description: "Match created: `{ match_id }`." }
        "409": { description: Challenge already taken. }

  /fixtures:
    get:
      tags: [Fixtures]
      summary: Match board (next 3 days, scraped — no API key)
      description: |
        Tanzania's Ligi Kuu Bara plus Europe's top five leagues and basketball
        (NBA / WNBA / FIBA). Includes live scores when matches are in play.
        Data courtesy of LiveScore — keep the credit visible in your UI.
      responses:
        "200":
          description: Fixtures ordered by kickoff.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Fixture" }

  /shop/products:
    get:
      tags: [Shop]
      summary: Storefront products
      responses:
        "200":
          description: In-stock products with R2 image URLs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Product" }

  /shop/orders:
    post:
      tags: [Shop]
      summary: Create an order
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
      responses:
        "201": { description: "Order created (pay via /shop/orders/{id}/pay)." }

  /shop/orders/{orderId}:
    get:
      tags: [Shop]
      summary: Order status
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Order with payment status. }

  /shop/orders/{orderId}/pay:
    post:
      tags: [Shop]
      summary: Pay an order by mobile money
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, operator]
              properties:
                phone: { type: string }
                operator: { type: string }
      responses:
        "200": { description: Charge initiated. }

  /waitlist:
    post:
      tags: [Misc]
      summary: Join a city's launch waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_id]
              properties:
                city_id: { type: string, format: uuid }
                email: { type: string, format: email }
                phone: { type: string }
      responses:
        "201": { description: On the list — notified at launch. }

  /venues/enroll:
    post:
      tags: [Misc]
      summary: Apply to list a venue (owner acquisition)
      description: Powers the "List your pitch" flow; the application lands in superadmin review and the applicant is emailed on approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venue_name, city_id, owner_name, owner_email, owner_phone]
              properties:
                venue_name: { type: string }
                area: { type: string }
                city_id: { type: string, format: uuid }
                owner_name: { type: string }
                owner_email: { type: string, format: email }
                owner_phone: { type: string, example: "+255744963858" }
                whatsapp: { type: boolean }
                latitude: { type: number }
                longitude: { type: number }
                photo_keys:
                  type: array
                  items: { type: string }
      responses:
        "202": { description: Application received. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    venueId:
      name: venueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    bookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    teamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    shareId:
      name: shareId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    NotFound:
      description: Resource not found.
    Unauthorized:
      description: Missing, invalid, or expired bearer token.

  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }

    City:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Zanzibar }
        status: { type: string, enum: [live, waitlist] }
        latitude: { type: number }
        longitude: { type: number }

    Venue:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        area: { type: string }
        city: { $ref: "#/components/schemas/City" }
        latitude: { type: number }
        longitude: { type: number }
        status: { type: string, enum: [active, suspended, pending, review] }
        verified: { type: boolean }
        rating: { type: number }
        amenities: { type: array, items: { type: string } }
        open_hours:
          type: object
          description: 'Weekly hours keyed mon..sun, e.g. {"mon":{"open":"08:00","close":"23:00"}}. Missing day = closed; empty object = default 08:00–23:00.'
          additionalProperties:
            type: object
            properties:
              open: { type: string, example: "08:00" }
              close: { type: string, example: "23:00" }
        pitches:
          type: array
          items: { $ref: "#/components/schemas/Pitch" }
        photos:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              alt: { type: string, description: Photo title shown to players. }
              sort: { type: integer }
        extras:
          type: array
          items: { $ref: "#/components/schemas/Extra" }

    Pitch:
      type: object
      description: The bookable unit. Only pitches with status `active` accept bookings; filter others out of player UIs.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Mikumi }
        format: { type: string, example: 5-a-side }
        surface: { type: string, example: artificial_turf }
        base_price_tzs: { type: integer, example: 70000 }
        status: { type: string, enum: [active, closed, suspended] }
        photo_url: { type: string, description: Lead photo. }
        photo_urls:
          type: array
          items: { type: string }
          description: Full gallery, lead first.

    Extra:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, example: bibs }
        name: { type: string, example: Rental bibs }
        price_tzs: { type: integer, description: 0 means free. }
        unit: { type: string, example: per set }
        stock: { type: integer, description: 0 means unlimited. }
        available: { type: boolean }

    Availability:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        pitches:
          type: array
          items:
            type: object
            properties:
              pitch: { $ref: "#/components/schemas/Pitch" }
              unavailable:
                type: array
                items:
                  type: object
                  properties:
                    starts_at: { type: string, format: date-time }
                    ends_at: { type: string, format: date-time }
                    kind: { type: string, enum: [booking, hold, processing, block] }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        stars: { type: integer }
        text: { type: string }
        owner_reply: { type: string }
        replied_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    TokenGrant:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/Profile" }

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        avatar_url: { type: string }
        language: { type: string, example: sw }

    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: PTZ-4K7Q2M, description: Shown at the gate. }
        pitch_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, part_paid, confirmed, cancelled] }
        pitch_fee_tzs: { type: integer }
        service_fee_tzs: { type: integer }
        total_tzs: { type: integer }
        paid_tzs: { type: integer }
        hold_expires_at:
          type: string
          format: date-time
          description: Pay before this or the slot releases; drive a visible countdown.
        shares:
          type: array
          items: { $ref: "#/components/schemas/Share" }

    Share:
      type: object
      properties:
        id: { type: string, format: uuid }
        amount_tzs: { type: integer }
        kind: { type: string, enum: [gateway, split] }
        status: { type: string, enum: [unpaid, paid] }
        paid_at: { type: string, format: date-time, nullable: true }
        pay_url: { type: string, description: Public page for this share — render as QR. }

    PublicShare:
      type: object
      properties:
        share_id: { type: string, format: uuid }
        amount_tzs: { type: integer }
        status: { type: string, enum: [unpaid, paid] }
        booking_code: { type: string }
        starts_at: { type: string, format: date-time }
        venue_name: { type: string }
        pitch_name: { type: string }

    TeamCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Mikocheni Warriors }
        tag: { type: string, example: MW, description: 2–3 letter badge text. }
        city: { type: string }
        area: { type: string }
        bio: { type: string }
        badge_color: { type: string, example: "#0e3b2c" }
        format: { type: string }
        recruiting: { type: boolean }
        needs: { type: string }
        members: { type: integer }
        open_challenges: { type: integer }
        is_captain: { type: boolean, description: Only when authenticated. }
        membership: { type: string, enum: [active, requested], description: Only when authenticated. }

    TeamMember:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        avatar_url: { type: string }
        role: { type: string, enum: [captain, player] }
        status: { type: string, enum: [active, requested] }

    Challenge:
      type: object
      properties:
        id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        team_name: { type: string }
        team_tag: { type: string }
        badge_color: { type: string }
        city: { type: string }
        area: { type: string }
        format: { type: string }
        note: { type: string }
        proposed_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [open, accepted, expired] }
        created_at: { type: string, format: date-time }

    Fixture:
      type: object
      properties:
        id: { type: string, format: uuid }
        sport: { type: string, enum: [football, basketball] }
        league: { type: string, example: Ligi Kuu Bara }
        country: { type: string, example: Tanzania }
        home: { type: string, example: Young Africans }
        away: { type: string, example: Pamba SC }
        home_score: { type: string, description: Empty until the match starts. }
        away_score: { type: string }
        kickoff_at: { type: string, format: date-time }
        status: { type: string, example: NS, description: LiveScore status codes (NS, 1H, HT, FT…). }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        price_tzs: { type: integer }
        image_url: { type: string }
        stock: { type: integer }
